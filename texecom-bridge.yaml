# Optional: transparent WiFi <-> panel-UART bridge. Flash this to turn the ESP32
# into a serial gateway so tools/txwintex.py can talk to the panel over the
# network instead of a USB-serial cable:
#
#     python3 tools/txwintex.py --socket <esp-ip>:6638 --code 1234 zones
#
# Same wiring as the main component (level shifter on GPIO25/26). This is just a
# raw byte pipe - it does not integrate the panel into Home Assistant.

substitutions:
  name: texecom-bridge

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  # Keep the console logger off the panel UART; it uses the USB UART.
  baud_rate: 115200

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://oxan/esphome-stream-server

# The panel COM port through the level shifter: 19200 8N2.
uart:
  id: panel_uart
  tx_pin: GPIO25
  rx_pin: GPIO26
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 2
  rx_buffer_size: 512

stream_server:
  uart_id: panel_uart
  port: 6638
